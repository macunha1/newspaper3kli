name: Setup Newspaper3kli build environment
description: Install Nix and persist the locked environment and uv downloads

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      with:
        install_url: https://releases.nixos.org/nix/nix-2.34.9/install
        extra_nix_config: |
          accept-flake-config = true

    - name: Restore and save Nix store
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: >-
          nix-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/actions/setup/action.yml') }}-${{
          hashFiles('flake.lock', '*.nix') }}
        restore-prefixes-first-match: >-
          nix-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/actions/setup/action.yml') }}-
        gc-max-store-size-linux: 2G

    - name: Restore and save uv downloads
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'uv.lock', 'pyproject.toml') }}
        restore-keys: uv-${{ runner.os }}-${{ runner.arch }}-
