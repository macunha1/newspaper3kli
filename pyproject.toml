[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "newspaper3kli"
version = "0.1.1"
description = "A command-line interface to Newspaper3k for downloading articles in bulk."
readme = "README.md"
requires-python = ">=3.15.2"
license = "Unlicense"
license-files = ["UNLICENSE"]
authors = [{name = "Matheus Cunha", email = "macunha@protonmail.com"}]
keywords = ["newspaper3k", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "aiohttp>=3.14.5",
    "newspaper4k>=0.9.6.1",
]

[dependency-groups]
dev = [
    "build>=1.6.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[project.urls]
Homepage = "https://macunha.me"
Source = "https://github.com/macunha1/newspaper3kli"

[project.scripts]
newspaper3kli = "newspaper3kli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["newspaper3kli*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.15"
files = ["src", "scripts"]
strict = true

[[tool.mypy.overrides]]
module = ["newspaper", "newspaper.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py315"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
